# Curated Golden Dataset for PSIRT Engine Evaluation (PRD Section 6 & Interview Q8)
# Measures VEX Reachability Precision/Recall/F1, CWE Accuracy, CNA Rule Accuracy,
# Noise Reduction Rate, Schema Pass Rate, and Zero-Leakage Redaction Rate.

targets:
  - name: "sample_python_app_on_prem"
    repo_rel_path: "tests/fixtures/sample_python_app"
    deployment_mode: "on_prem"
    expected_min_redactions: 4
    expected_prompt_injections_min: 1
    expected_cases:
      - match_cve: "CVE-2020-14343"
        expected_cwe: "CWE-502"
        expected_vex_status: "affected"
        expected_cna_decision: "reference_upstream_cve"
        expected_kev: false
      - match_cve: "CVE-2023-50447"
        expected_cwe: "CWE-94"
        expected_vex_status: "not_affected"
        expected_cna_decision: "no_cve_not_affected"
        expected_kev: false
      - match_cve: "CVE-2023-45803"
        expected_cwe: "CWE-200"
        expected_vex_status: "not_affected"
        expected_cna_decision: "no_cve_not_affected"
        expected_kev: false
      - match_cve: "CVE-2023-32681"
        expected_cwe: "CWE-200"
        expected_vex_status: "not_affected"
        expected_cna_decision: "no_cve_not_affected"
        expected_kev: false
      - match_title_contains: "SQL Injection"
        expected_cwe: "CWE-89"
        expected_vex_status: "affected"
        expected_cna_decision: "assign_new_cve"
      - match_title_contains: "OS Command Injection"
        expected_cwe: "CWE-78"
        expected_vex_status: "affected"
        expected_cna_decision: "assign_new_cve"

  - name: "sample_python_app_saas"
    repo_rel_path: "tests/fixtures/sample_python_app"
    deployment_mode: "saas"
    expected_min_redactions: 4
    expected_prompt_injections_min: 1
    expected_cases:
      - match_title_contains: "SQL Injection"
        expected_cwe: "CWE-89"
        expected_vex_status: "affected"
        expected_cna_decision: "no_cve_saas_excluded"
      - match_title_contains: "OS Command Injection"
        expected_cwe: "CWE-78"
        expected_vex_status: "affected"
        expected_cna_decision: "no_cve_saas_excluded"

  - name: "sample_go_app_on_prem"
    repo_rel_path: "tests/fixtures/sample_go_app"
    deployment_mode: "on_prem"
    expected_min_redactions: 0
    expected_prompt_injections_min: 0
    expected_cases:
      - match_cve: "CVE-2023-44487"
        expected_cwe: "CWE-400"
        expected_vex_status: "affected"
        expected_cna_decision: "reference_upstream_cve"
        expected_kev: true
      - match_cve: "CVE-2024-45337"
        expected_cwe: "CWE-287"
        expected_vex_status: "not_affected"
        expected_cna_decision: "no_cve_not_affected"
        expected_kev: false
      - match_title_contains: "OS Command Injection"
        expected_cwe: "CWE-78"
        expected_vex_status: "affected"
        expected_cna_decision: "assign_new_cve"
